# Host ports below (postgres/redis/jaeger/kafka) default to their historical
# fixed values but are env-var-overridable — scripts/run.sh sets
# POSTGRES_PORT/REDIS_PORT/JAEGER_*_PORT/KAFKA_PORT itself when it detects
# the default is already taken by something outside this project's own
# compose stack, so `docker compose up` doesn't just fail on a conflict.
# Running `docker compose` directly (bypassing run.sh) still works exactly
# as before — the defaults kick in when these vars aren't set.
#
# toxiproxy's ports stay fixed (not routed around): the app is a host JVM
# process that dials the whole 20000-20049 range directly by fixed port
# number per real-infra session (PLAN.md step 21/23), so making that range
# dynamic would need matching changes in ToxiproxySessionProxy's config, not
# just this file — out of scope here.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sysdrill
      POSTGRES_USER: sysdrill
      POSTGRES_PASSWORD: sysdrill
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - sysdrill_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sysdrill -d sysdrill"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # PLAN.md step 23 — real-infra coupon pilot only. The app (a host JVM
  # process, not containerized) reaches the admin API and each dynamically
  # created per-session proxy via localhost, so both the admin port and the
  # whole proxy port range must be published. 50 ports = 50 concurrent
  # real-infra sessions max, plenty for a pilot.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    ports:
      - "8474:8474"
      - "20000-20049:20000-20049"

  # PLAN.md step 24 — real distributed tracing, real-infra coupon pilot only.
  # all-in-one accepts OTLP natively (no separate Collector needed for a
  # pilot at this scale). UI on 16686; OTLP gRPC/HTTP on 4317/4318 published
  # for the app (a host JVM process) to export to.
  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${JAEGER_OTLP_GRPC_PORT:-4317}:4317"
      - "${JAEGER_OTLP_HTTP_PORT:-4318}:4318"

  # PLAN.md step 27 — real-infra notification pilot only. Single-node KRaft
  # broker (no ZooKeeper) from the official Apache Kafka image. Host port
  # 19092, not the default 9092 — same reasoning as postgres's 5433: avoid
  # colliding with any other local Kafka the dev machine might already run.
  # The app is a host JVM process (not containerized), so it only ever
  # connects to the single PLAINTEXT listener published below; the CONTROLLER
  # listener is purely internal to this one KRaft node.
  kafka:
    image: apache/kafka:3.9.0
    hostname: kafka
    ports:
      - "${KAFKA_PORT:-19092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Empty host (not 0.0.0.0) — matches the image's own default template.
      # A literal "0.0.0.0" here makes Kafka's advertised-listener fallback
      # (used for the listener names KAFKA_ADVERTISED_LISTENERS doesn't cover,
      # i.e. CONTROLLER) inherit that literal non-routable address and fail
      # startup validation; the empty-host idiom means "bind all interfaces"
      # without being treated as an advertisable host.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

volumes:
  sysdrill_postgres_data:

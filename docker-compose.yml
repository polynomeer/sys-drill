services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sysdrill
      POSTGRES_USER: sysdrill
      POSTGRES_PASSWORD: sysdrill
    ports:
      - "5433:5432"
    volumes:
      - sysdrill_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sysdrill -d sysdrill"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  sysdrill_postgres_data:

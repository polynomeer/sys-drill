services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sysdrill
      POSTGRES_USER: sysdrill
      POSTGRES_PASSWORD: sysdrill
    ports:
      - "5433:5432"
    volumes:
      - sysdrill_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sysdrill -d sysdrill"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # PLAN.md step 23 — real-infra coupon pilot only. The app (a host JVM
  # process, not containerized) reaches the admin API and each dynamically
  # created per-session proxy via localhost, so both the admin port and the
  # whole proxy port range must be published. 50 ports = 50 concurrent
  # real-infra sessions max, plenty for a pilot.
  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.9.0
    ports:
      - "8474:8474"
      - "20000-20049:20000-20049"

  # PLAN.md step 24 — real distributed tracing, real-infra coupon pilot only.
  # all-in-one accepts OTLP natively (no separate Collector needed for a
  # pilot at this scale). UI on 16686; OTLP gRPC/HTTP on 4317/4318 published
  # for the app (a host JVM process) to export to.
  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

volumes:
  sysdrill_postgres_data:

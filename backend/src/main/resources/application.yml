server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:sysdrill}
    username: ${DB_USER:sysdrill}
    password: ${DB_PASSWORD:sysdrill}
    hikari:
      # docs/COMMERCIALIZATION.md — was an unset (implicit HikariCP default,
      # also 10) before; made explicit because EvaluationWorker/BuildRunnerWorker
      # threads (sysdrill.evaluation/build.worker-concurrency above) borrow
      # from this same pool alongside HTTP request threads. Raise this if you
      # raise either worker-concurrency past what headroom this leaves.
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    # V44(TypeScript rate-limiter 테스트 스크립트)가 JS 템플릿 리터럴
    # `${...}` 를 시드 SQL 안에 그대로 담고 있는데, Flyway는 기본적으로
    # `${...}` 를 자기 자신의 플레이스홀더 치환 문법으로 해석해 파싱이 깨진다
    # ("No value provided for placeholder"). 이 앱은 Flyway 플레이스홀더
    # 기능을 한 번도 쓴 적이 없어(모든 마이그레이션이 순수 시드 SQL) 그냥 꺼도
    # 안전하다.
    placeholder-replacement: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

sysdrill:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  # docs/COMMERCIALIZATION.md — the one signal this repo has for "this is a
  # real deployment, not bootRun/tests". Set by Dockerfile; nothing else
  # sets it. See JwtSecretStartupCheck for the one thing that currently
  # reads it.
  deployment-mode: ${SYSDRILL_DEPLOYMENT_MODE:}
  auth:
    # PLAN.md step 30 — HMAC signing secret for issued JWTs. The dev default
    # is fine for local/demo use (same trust boundary ADR-0003 already
    # accepted); a real deployment must override this via env var.
    jwt-secret: ${SYSDRILL_AUTH_JWT_SECRET:dev-only-insecure-secret-change-me}
    token-ttl-days: ${SYSDRILL_AUTH_TOKEN_TTL_DAYS:30}
    # docs/COMMERCIALIZATION.md — how long UserExistenceCache trusts a
    # positive/negative "does this user still exist" lookup before re-checking
    # the DB. Bounds how quickly a deleted user's stale token starts failing.
    user-exists-cache-ttl-seconds: ${SYSDRILL_AUTH_USER_EXISTS_CACHE_TTL_SECONDS:60}
    # PLAN.md step 35 — comma-separated emails that become PLATFORM_ADMIN on
    # signup. Empty by default (no platform admins) — set for local/demo use.
    platform-admin-emails: ${SYSDRILL_AUTH_PLATFORM_ADMIN_EMAILS:}
    google:
      # PLAN.md step 37 — "Google로 계속하기". Empty by default: GoogleAuthService
      # refuses to build an authorization URL until these are set, since there's
      # no meaningful offline fallback for identity verification (unlike
      # AnthropicLlmClient's blank-api-key stub).
      client-id: ${SYSDRILL_AUTH_GOOGLE_CLIENT_ID:}
      client-secret: ${SYSDRILL_AUTH_GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${SYSDRILL_AUTH_GOOGLE_REDIRECT_URI:http://localhost:8081/auth/google/callback}
    # docs/COMMERCIALIZATION.md
    password-reset-ttl-minutes: ${SYSDRILL_AUTH_PASSWORD_RESET_TTL_MINUTES:30}
    email-verification-ttl-hours: ${SYSDRILL_AUTH_EMAIL_VERIFICATION_TTL_HOURS:48}
    rate-limit:
      # Generous enough that a legitimate user mistyping a password a few
      # times, or this project's own test suite's aggregate /auth/* traffic
      # sharing one Redis instance, never trips it — still tight enough to
      # slow down real credential-stuffing.
      max-requests-per-minute: ${SYSDRILL_AUTH_RATE_LIMIT_PER_MINUTE:100}
    login-lockout:
      max-attempts: ${SYSDRILL_AUTH_LOGIN_LOCKOUT_MAX_ATTEMPTS:5}
      lockout-minutes: ${SYSDRILL_AUTH_LOGIN_LOCKOUT_MINUTES:15}
  mail:
    # docs/COMMERCIALIZATION.md — the actual host/port/username/password come
    # from Spring Boot's own spring.mail.* properties (so its MailSenderAutoConfiguration
    # wires JavaMailSender only when spring.mail.host is set) -- this is just
    # the display "From" address, which Spring's autoconfiguration has no
    # equivalent for.
    from: ${SYSDRILL_MAIL_FROM:no-reply@sysdrill.dev}
  organization:
    # PLAN.md step 32 — how long an email-bound invitation stays redeemable.
    invitation-ttl-days: ${SYSDRILL_ORG_INVITATION_TTL_DAYS:7}
  learning:
    path:
      # docs/LEARNING_COMMUNITY_PLAN.md §5.3 — 학습 경로에 한 번에 보여줄 단계 수.
      # 너무 길면 경로가 아니라 또 하나의 목록이 된다.
      max-steps: ${LEARNING_PATH_MAX_STEPS:3}
  community:
    benchmark:
      # docs/LEARNING_COMMUNITY_PLAN.md §6.1 — 이 표본 수에 못 미치면 분포와
      # 순위를 감춘다. 3명이 푼 시나리오의 "상위 33%"는 정보가 아니라 노이즈다.
      # 설정값인 이유는 실제 참여자 수를 보고 조정할 항목이기 때문.
      min-sample-size: ${COMMUNITY_BENCHMARK_MIN_SAMPLE_SIZE:5}
    recent-completions:
      # docs/CODECRAFTERS_BENCHMARK.md §7 — 서로 다른 완료자가 이 수에 못 미치면
      # "최근 완료" 목록을 비운다. 한두 명일 때는 이름 목록이 곧 "이 Drill을 한
      # 사람이 누구인가"가 된다. 벤치마크와 같은 이유의 하한이지만 이름을 보여주는
      # 것이라 더 낮게 둘 수 있다.
      min-completers: ${COMMUNITY_RECENT_COMPLETIONS_MIN:3}
  certification:
    # Phase 5 (docs/adr/0032) — a config value, not a hardcoded constant, so
    # the bar can move without a migration since certification is computed
    # live, never persisted.
    passing-score: ${CERTIFICATION_PASSING_SCORE:70}
  evaluation:
    queue-key: ${EVALUATION_QUEUE_KEY:sysdrill:evaluation:jobs}
    dead-letter-key: ${EVALUATION_DEAD_LETTER_KEY:sysdrill:evaluation:dead-letter}
    max-attempts: ${EVALUATION_MAX_ATTEMPTS:3}
    # docs/COMMERCIALIZATION.md — caps per-user LLM spend. Generous default
    # (normal usage is a handful of submissions/day); exists to catch runaway
    # abuse, not to throttle real training sessions.
    daily-limit-per-user: ${EVALUATION_DAILY_LIMIT_PER_USER:50}
    # docs/COMMERCIALIZATION.md — the daily cap above doesn't stop a burst
    # that spends the whole day's budget in seconds. Per-user, per-minute,
    # via ActionRateLimiter.
    rate-limit-per-minute: ${EVALUATION_RATE_LIMIT_PER_MINUTE:5}
    # docs/COMMERCIALIZATION.md — how many EvaluationWorker threads poll the
    # queue concurrently. This is I/O-bound (an LLM HTTP round-trip per job,
    # no local CPU/memory reservation like BuildRunnerWorker's containers
    # below), so the default can be generous. Raising this shares the same
    # HikariCP pool as everything else (see spring.datasource.hikari below).
    worker-concurrency: ${EVALUATION_WORKER_CONCURRENCY:4}
  llm:
    anthropic:
      # Namespaced under LLM_* (not ANTHROPIC_*) so this never collides with
      # env vars Claude Code itself may already have set in this shell.
      base-url: ${LLM_ANTHROPIC_BASE_URL:https://api.anthropic.com}
      api-key: ${LLM_ANTHROPIC_API_KEY:}
      model: ${LLM_ANTHROPIC_MODEL:claude-sonnet-5}
      # A ceiling, not a spend target — the model stops at end_turn long before
      # this and only the tokens actually generated are billed. It has to cover
      # the model's own thinking (claude-sonnet-5 thinks adaptively by default
      # and its thinking tokens count against max_tokens) PLUS the Korean JSON
      # evaluation. Measured on a real design_evaluation call: ~1.7k thinking
      # + ~1.9k text = ~3.6k output tokens. The previous 2000 was silently
      # fatal — the model spent the whole budget thinking and returned no text
      # block at all, or cut the JSON mid-string (both seen 2026-09-21).
      max-tokens: ${LLM_ANTHROPIC_MAX_TOKENS:16000}
  build:
    queue-key: ${BUILD_QUEUE_KEY:sysdrill:build:jobs}
    sandbox-image: ${BUILD_SANDBOX_IMAGE:python:3.12-slim}
    # rate-limiter 챌린지에 TypeScript 지원 추가 — node의 네이티브 타입 스트리핑
    # (`node --experimental-strip-types`)만으로 컴파일 없이 .ts를 바로 실행 가능해
    # npm install/네트워크 없이도 --network none 샌드박스와 호환된다.
    sandbox-image-typescript: ${BUILD_SANDBOX_IMAGE_TS:node:22-slim}
    # Java·Kotlin·Go 판(ADR-0051). Java는 공식 JDK 이미지 그대로지만 Kotlin(공식
    # 컴파일러 이미지가 없음)과 Go(표준 라이브러리 빌드 캐시가 필요)는 sandbox/ 의
    # Dockerfile로 빌드한다: `docker compose --profile sandbox-images build`.
    sandbox-image-java: ${BUILD_SANDBOX_IMAGE_JAVA:eclipse-temurin:25-jdk}
    sandbox-image-kotlin: ${BUILD_SANDBOX_IMAGE_KOTLIN:sysdrill/sandbox-kotlin:2.4.20}
    sandbox-image-go: ${BUILD_SANDBOX_IMAGE_GO:sysdrill/sandbox-go:1.25}
    timeout-seconds: ${BUILD_TIMEOUT_SECONDS:10}
    # docs/COMMERCIALIZATION.md — how many BuildRunnerWorker threads run
    # concurrently. Unlike evaluation's worker-concurrency above, this is a
    # direct resource dial, not just a throughput one: each thread blocks on
    # its own `docker run` (--cpus 0.5 --memory 128m; Kotlin --cpus 1.0
    # --memory 512m), so this many threads means up to that many containers
    # running at once. Default of 2 reserves at most ~2 CPU / 1GB for
    # sandboxes -- raise only alongside host capacity.
    worker-concurrency: ${BUILD_WORKER_CONCURRENCY:2}
    # docs/COMMERCIALIZATION.md — not an LLM call, but a real docker sandbox
    # run per stage; had no rate limit of any kind before this.
    rate-limit-per-minute: ${BUILD_RATE_LIMIT_PER_MINUTE:10}
  mentor:
    # docs/COMMERCIALIZATION.md — AI 4역할 Slice 3's hint request has no daily
    # cap the way a real submission does (LlmUsageGuard); this is its only guard.
    rate-limit-per-minute: ${MENTOR_RATE_LIMIT_PER_MINUTE:10}
  postmortem:
    # docs/COMMERCIALIZATION.md — every PUT regenerates LLM coaching
    # (PostmortemService.generateCoaching); had no guard before this.
    rate-limit-per-minute: ${POSTMORTEM_RATE_LIMIT_PER_MINUTE:5}
  session:
    # PLAN.md step 28 — per-phase time limit when a session opts into
    # interview-timer mode (docs/PRD.md §12's "Advanced/Interview" tier).
    # Deliberately per-phase-type, not one flat number: INCIDENT is shorter
    # than INITIAL/FOLLOWUP because it's a live-response phase, not a design
    # writeup, mirroring a real system-design interview's time budget.
    interview-timer:
      initial-seconds: ${INTERVIEW_TIMER_INITIAL_SECONDS:600}
      followup-seconds: ${INTERVIEW_TIMER_FOLLOWUP_SECONDS:600}
      incident-seconds: ${INTERVIEW_TIMER_INCIDENT_SECONDS:480}
  tracing:
    # PLAN.md Round E25 (O6) — Jaeger's query API for real-infra coupon traces. Same port variable as
    # docker-compose.yml's JAEGER_UI_PORT so the two can't drift (see RealInfraCouponTracingTest).
    jaeger-query-url: ${JAEGER_QUERY_URL:http://localhost:${JAEGER_UI_PORT:16686}}
  simulation:
    # docs/COMMERCIALIZATION.md — AI 4역할 Slice 4 (Director)'s narration call,
    # per user. Unlike mentor/postmortem/build above, going over this doesn't
    # block anything -- SimulationService.generateNarration is fail-open by
    # design, so an over-budget request just starts the incident without a
    # narration line (frontend's static fallback), same as any other failure.
    narration-rate-limit-per-minute: ${SIMULATION_NARRATION_RATE_LIMIT_PER_MINUTE:10}
    realinfra:
      # PLAN.md step 21 — coupon-only real-infra pilot. baseline/incident-rps are
      # deliberately NOT the rule-based engine's 300/6000 — that would saturate a
      # laptop's shared Postgres container on machine limits, not on the trait
      # being taught. Re-calibrated in step 23: once every query has a real
      # ~300ms Toxiproxy latency floor, a 4-connection pool caps out around
      # 4/0.3s ≈ 13 req/s — incident-rps=3000 (step 21's pre-toxic value) made
      # essentially every request hit k6's own 5s client timeout. incident-rps
      # of just 30 already produces a dramatic, real p95 (baseline ~1.3s,
      # recovered ~0.7s — better, but never near the pre-toxic floor, since
      # none of the three actions fix network latency itself; ADR-0015).
      k6-image: ${REALINFRA_K6_IMAGE:grafana/k6}
      probe-duration-seconds: ${REALINFRA_PROBE_DURATION_SECONDS:3}
      baseline-rps: ${REALINFRA_BASELINE_RPS:10}
      incident-rps: ${REALINFRA_INCIDENT_RPS:30}
      max-db-pool-size: ${REALINFRA_MAX_DB_POOL_SIZE:20}
      # Phase 3-B (docs/DRILLS_SIMULATION_VISION.md §6) — Traffic Lab bounds for
      # a user-chosen target RPS / load duration, clamped in RealInfraCouponEngine.
      max-configurable-rps: ${REALINFRA_MAX_CONFIGURABLE_RPS:100}
      max-configurable-duration-seconds: ${REALINFRA_MAX_CONFIGURABLE_DURATION_SECONDS:10}
      # local.server.port (not server.port) — Spring Boot always publishes the
      # actual bound port under this key, whether fixed or random, so this
      # works unchanged for RANDOM_PORT tests and isn't hardcoded to 8081.
      app-base-url: ${REALINFRA_APP_BASE_URL:http://host.docker.internal:${local.server.port}}
      # PLAN.md step 22 — abandoned sessions' Postgres schema/HikariDataSource
      # don't expire on their own; a background sweep checks every
      # sweep-interval-minutes and drops anything untouched for longer than
      # session-idle-timeout-minutes (matches SimulationStateStore's 6h TTL —
      # same "idle session" definition used everywhere else).
      sweep-interval-minutes: ${REALINFRA_SWEEP_INTERVAL_MINUTES:30}
      session-idle-timeout-minutes: ${REALINFRA_SESSION_IDLE_TIMEOUT_MINUTES:360}
      toxiproxy:
        # PLAN.md step 23 — a real, controllable network fault (added DB
        # latency) injected via a per-session Toxiproxy proxy, instead of
        # relying purely on k6 load volume to make contention visible.
        # postgres-upstream uses the compose SERVICE name/internal port
        # (5432), not DB_HOST/DB_PORT above (those are the HOST-published
        # 5433 the app itself uses) — Toxiproxy reaches Postgres over the
        # docker-compose network directly, bypassing the host port mapping.
        admin-url: ${REALINFRA_TOXIPROXY_ADMIN_URL:http://localhost:8474}
        postgres-upstream: ${REALINFRA_TOXIPROXY_PG_UPSTREAM:postgres:5432}
        db-name: ${DB_NAME:sysdrill}
        port-range-start: ${REALINFRA_TOXIPROXY_PORT_RANGE_START:20000}
        port-range-size: ${REALINFRA_TOXIPROXY_PORT_RANGE_SIZE:50}
        latency-ms: ${REALINFRA_TOXIPROXY_LATENCY_MS:300}
        jitter-ms: ${REALINFRA_TOXIPROXY_JITTER_MS:50}
      # PLAN.md step 27 — notification-only real-infra pilot: a real, shared,
      # single-node Kafka broker (docker-compose), topic-per-session (ADR-0013's
      # schema-per-session reasoning, applied to Kafka). No external load-gen
      # container (ADR-0017) — the producer/consumer threads run in-process,
      # using the plain kafka-clients library directly.
      kafka:
        bootstrap-servers: ${REALINFRA_KAFKA_BOOTSTRAP_SERVERS:localhost:19092}
        # Real partition count caps real consumer parallelism per session —
        # Kafka simply won't assign more consumers than partitions to one
        # group, so this is also ADD_CONSUMERS' real ceiling.
        partitions-per-session: ${REALINFRA_KAFKA_PARTITIONS:6}
        probe-duration-seconds: ${REALINFRA_KAFKA_PROBE_DURATION_SECONDS:6}
        # Extra time consumers keep draining after the producer stops, before
        # being interrupted — lets the probe's own tail backlog actually get
        # measured as "processed or expired" instead of just abandoned mid-poll.
        drain-buffer-ms: ${REALINFRA_KAFKA_DRAIN_BUFFER_MS:2000}
        baseline-event-rate: ${REALINFRA_KAFKA_BASELINE_EVENT_RATE:20}
        incident-event-rate: ${REALINFRA_KAFKA_INCIDENT_EVENT_RATE:150}
        # A message counts as failed (published-to-DLQ-equivalent, counted into
        # errorRate) if its real end-to-end (publish -> consume) latency exceeds
        # this — "the notification arrived so late it's no longer useful".
        expiry-ms: ${REALINFRA_KAFKA_EXPIRY_MS:800}

management:
  endpoints:
    web:
      exposure:
        include: health,info
      cors:
        allowed-origins: ${FRONTEND_ORIGIN:http://localhost:3000}
        allowed-methods: GET
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    sampling:
      # PLAN.md step 24 — this is a low-traffic dev pilot; sample everything
      # so the coupon real-infra spans always show up in Jaeger. Auto-
      # instruments Spring MVC request handling for free; JDBC calls (the
      # part that actually matters — showing the real Toxiproxy-injected
      # latency) are NOT auto-instrumented without a JDBC proxy dependency,
      # so RealInfraCouponController wraps those explicitly instead.
      probability: ${OTEL_TRACES_SAMPLER_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          # NOT management.otlp.tracing.endpoint (Boot 3.x's key, still present
          # in this version's metadata but silently a no-op with the new
          # spring-boot-starter-opentelemetry) — confirmed empirically by
          # traces reaching the SdkSpan layer (visible in DEBUG logs, so
          # spans genuinely existed) but never showing up in Jaeger until
          # this property was set under the new management.opentelemetry.*
          # namespace instead.
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        # spring-boot-starter-opentelemetry enables OTLP metrics export by
        # default too — Jaeger only ingests traces, so this just 404s on
        # every export cycle. Traces are the only signal this step adds.
        enabled: false

sentry:
  # docs/COMMERCIALIZATION.md — DSN 미설정 시 SDK가 스스로 비활성 상태가 되는
  # 것은 Sentry SDK 자체의 동작(프론트 instrumentation.ts와 동일한 전제).
  dsn: ${SENTRY_DSN:}
  # 이 프로젝트는 이미 OpenTelemetry+Jaeger로 분산 트레이싱을 갖고 있다
  # (management.tracing.* 위 참고) — Sentry의 자체 성능 트레이싱까지 켜면
  # 트레이싱 시스템이 둘로 쪼개지므로, 에러 캡처 용도로만 쓴다.
  traces-sample-rate: 0

server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:sysdrill}
    username: ${DB_USER:sysdrill}
    password: ${DB_PASSWORD:sysdrill}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info
      cors:
        allowed-origins: ${FRONTEND_ORIGIN:http://localhost:3000}
        allowed-methods: GET
  endpoint:
    health:
      show-details: when-authorized
